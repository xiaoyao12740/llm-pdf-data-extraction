paths:
  raw: data/raw
  ground_truth: data/ground_truth/ground_truth.json
  processed: data/processed
validation:
  rate_tolerance: 0.005
database:
  enabled: false
  driver: mysql+pymysql
llm:
  enabled: false
  provider: ollama
  model: qwen2.5:7b
  base_url: http://localhost:11434
  confidence_threshold: 0.60
  timeout: 120
  failure_policy: fallback_rules
